# Alembic configuration
# The sqlalchemy.url value here is a placeholder.
# The real URL is injected at runtime by migrations/env.py reading DATABASE_URL
# from the environment — this file is never the authoritative source.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden by env.py when DATABASE_URL is set (e.g. from .env).
# Must match your Postgres setup: Docker uses ctf_user / ctf_config by default.
sqlalchemy.url = postgresql+asyncpg://ctf_user:secret@localhost/ctf_config

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
