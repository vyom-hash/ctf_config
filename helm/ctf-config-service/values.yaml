replicaCount: 2
color: blue   # 🔥 active deployment (blue / green) — overridden by pipeline --set

image:
  repository: git.cr.zindagi.tech:5050/ncr2.0/ctf_config_service
  tag: latest
  pullPolicy: IfNotPresent

container:
  port: 8000
  
  command:
    - /bin/bash
    - -c
  args:
    - "alembic upgrade head && gunicorn -c gunicorn.conf.py main:app"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  port: 8000

# gateway — enabled/disabled by the pipeline via --set gateway.enabled=true/false
# hostname is always overridden by values-dev.yaml / values-qa.yaml
gateway:
  enabled: false          # pipeline sets this; never deploy with base defaults alone
  name: my-gateway
  namespace: default
  hostname: ""            # MUST be overridden by env values file

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpuUtilization: 70
